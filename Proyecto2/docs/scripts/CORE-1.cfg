! CORE-1 - BanTech GT (Proyecto 2, 202300476)
!
enable
configure terminal
hostname CORE-1
no ip domain-lookup
banner motd #BanTech GT - Acceso restringido. Solo personal autorizado.#
line console 0
 logging synchronous
exit
ip routing
spanning-tree mode rapid-pvst
interface range GigabitEthernet0/1 - 2
 description Po1 EtherChannel L3 hacia CORE-2
 no switchport
 channel-group 1 mode active
 no shutdown
exit
interface Port-channel1
 description EtherChannel L3 LACP hacia CORE-2
 ip address 10.76.0.1 255.255.255.252
exit
interface FastEthernet0/1
 description Enlace a CORE-3
 no switchport
 ip address 10.76.0.5 255.255.255.252
 no shutdown
exit
interface FastEthernet0/2
 description Enlace RIPv2 hacia R-Occidente
 no switchport
 ip address 10.76.0.13 255.255.255.252
 no shutdown
exit
interface FastEthernet0/3
 description Enlace OSPF hacia MS1 Oriente
 no switchport
 ip address 10.76.0.17 255.255.255.252
 no shutdown
exit
router ospf 1
router-id 1.1.1.1
 network 10.76.0.0 0.0.0.3 area 0
 network 10.76.0.4 0.0.0.3 area 0
 network 10.76.0.12 0.0.0.3 area 0
 network 10.76.0.16 0.0.0.3 area 0
 passive-interface FastEthernet0/2
 redistribute rip subnets
exit
router rip
 version 2
 no auto-summary
 network 10.0.0.0
 passive-interface default
 no passive-interface FastEthernet0/2
 redistribute ospf 1 metric 2
exit
end
write memory
