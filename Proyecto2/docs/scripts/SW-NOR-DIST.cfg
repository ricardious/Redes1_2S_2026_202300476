! SW-NOR-DIST - BanTech GT (Proyecto 2, 202300476)
!
enable
configure terminal
hostname SW-NOR-DIST
no ip domain-lookup
banner motd #BanTech GT - Acceso restringido. Solo personal autorizado.#
line console 0
 logging synchronous
exit
vlan 52
 name Analisis
exit
vlan 62
 name Auditoria
exit
vlan 72
 name Legal
exit
spanning-tree mode rapid-pvst
spanning-tree vlan 52,62,72 priority 4096
interface FastEthernet0/24
 description Troncal hacia R-Norte (router-on-a-stick)
 switchport mode trunk
 no shutdown
exit
interface GigabitEthernet0/1
 description Anillo: troncal hacia SW-NOR-ACC1
 switchport mode trunk
 no shutdown
exit
interface GigabitEthernet0/2
 description Anillo: troncal hacia SW-NOR-ACC2
 switchport mode trunk
 no shutdown
exit
end
write memory
