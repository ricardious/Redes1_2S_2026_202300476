! CORE-2 - BanTech GT (Proyecto 2, 202300476)
!
enable
configure terminal
hostname CORE-2
no ip domain-lookup
banner motd #BanTech GT - Acceso restringido. Solo personal autorizado.#
line console 0
 logging synchronous
exit
ip routing
spanning-tree mode rapid-pvst
interface range GigabitEthernet0/1 - 2
 description Po1 EtherChannel L3 hacia CORE-1
 no switchport
 channel-group 1 mode active
 no shutdown
exit
interface Port-channel1
 description EtherChannel L3 LACP hacia CORE-1
 ip address 10.76.0.2 255.255.255.252
exit
interface FastEthernet0/1
 description Enlace a CORE-3
 no switchport
 ip address 10.76.0.9 255.255.255.252
 no shutdown
exit
interface FastEthernet0/2
 description Enlace OSPF hacia R-Central1
 no switchport
 ip address 10.76.0.25 255.255.255.252
 no shutdown
exit
interface FastEthernet0/3
 description Enlace OSPF hacia MS2 Oriente
 no switchport
 ip address 10.76.0.21 255.255.255.252
 no shutdown
exit
router ospf 1
router-id 2.2.2.2
 network 10.76.0.0 0.0.0.3 area 0
 network 10.76.0.8 0.0.0.3 area 0
 network 10.76.0.20 0.0.0.3 area 0
 network 10.76.0.24 0.0.0.3 area 0
exit
end
write memory
