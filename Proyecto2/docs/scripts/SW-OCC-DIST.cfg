! SW-OCC-DIST - BanTech GT (Proyecto 2, 202300476)
!
enable
configure terminal
hostname SW-OCC-DIST
no ip domain-lookup
banner motd #BanTech GT - Acceso restringido. Solo personal autorizado.#
line console 0
 logging synchronous
exit
vtp mode server
vtp domain bantech76
vtp password cisco
vtp version 2
vlan 12
 name Cajas
exit
vlan 22
 name Asesores
exit
vlan 32
 name Gerencia
exit
vlan 42
 name Seguridad
exit
spanning-tree mode rapid-pvst
spanning-tree vlan 12,22,32,42 priority 4096
interface FastEthernet0/24
 description Troncal hacia R-Occidente (router-on-a-stick)
 switchport mode trunk
 no shutdown
exit
interface GigabitEthernet0/1
 description Troncal hacia SW-OCC-ACC1
 switchport mode trunk
 no shutdown
exit
interface GigabitEthernet0/2
 description Troncal hacia SW-OCC-ACC2
 switchport mode trunk
 no shutdown
exit
end
write memory
