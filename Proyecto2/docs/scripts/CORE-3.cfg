! CORE-3 - BanTech GT (Proyecto 2, 202300476)
!
enable
configure terminal
hostname CORE-3
no ip domain-lookup
banner motd #BanTech GT - Acceso restringido. Solo personal autorizado.#
line console 0
 logging synchronous
exit
interface GigabitEthernet0/0
 description Enlace a CORE-1
 ip address 10.76.0.6 255.255.255.252
 no shutdown
exit
interface GigabitEthernet0/1
 description Enlace a CORE-2
 ip address 10.76.0.10 255.255.255.252
 no shutdown
exit
interface GigabitEthernet0/0/0
 description Fibra optica hacia R-Central1
 ip address 10.76.0.29 255.255.255.252
 no shutdown
exit
interface Serial0/1/0
 description WAN serial EIGRP hacia R-Norte
 ip address 10.76.0.33 255.255.255.252
 clock rate 2000000
 no shutdown
exit
router ospf 1
router-id 3.3.3.3
 network 10.76.0.4 0.0.0.3 area 0
 network 10.76.0.8 0.0.0.3 area 0
 network 10.76.0.28 0.0.0.3 area 0
 network 10.76.0.32 0.0.0.3 area 0
 passive-interface Serial0/1/0
 redistribute eigrp 100 subnets
exit
router eigrp 100
 no auto-summary
 network 10.76.0.32 0.0.0.3
 redistribute ospf 1 metric 1544 20000 255 1 1500
exit
end
write memory
