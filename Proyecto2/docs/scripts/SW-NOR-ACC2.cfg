! SW-NOR-ACC2 - BanTech GT (Proyecto 2, 202300476)
!
enable
configure terminal
hostname SW-NOR-ACC2
no ip domain-lookup
banner motd #BanTech GT - Acceso restringido. Solo personal autorizado.#
line console 0
 logging synchronous
exit
vlan 52
 name Analisis
exit
vlan 62
 name Auditoria
exit
vlan 72
 name Legal
exit
spanning-tree mode rapid-pvst
interface GigabitEthernet0/1
 description Anillo: troncal hacia SW-NOR-DIST
 switchport mode trunk
 no shutdown
exit
interface GigabitEthernet0/2
 description Anillo: troncal hacia SW-NOR-ACC1
 switchport mode trunk
 no shutdown
exit
interface range FastEthernet0/1 - 7
 description Hosts VLAN 62 Auditoria
 switchport mode access
 switchport access vlan 62
 spanning-tree portfast
exit
interface range FastEthernet0/8 - 10
 description Hosts VLAN 72 Legal
 switchport mode access
 switchport access vlan 72
 spanning-tree portfast
exit
end
write memory
