 no shutdown
exit
ip route 0.0.0.0 0.0.0.0 10.76.0.37
ip route 10.76.40.0 255.255.255.224 10.76.0.42
ip route 10.76.40.32 255.255.255.224 10.76.0.42
ip route 10.76.40.64 255.255.255.240 10.76.0.42
end
write memory
