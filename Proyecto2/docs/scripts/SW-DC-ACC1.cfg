! SW-DC-ACC1 - BanTech GT (Proyecto 2, 202300476)
!
enable
configure terminal
hostname SW-DC-ACC1
no ip domain-lookup
banner motd #BanTech GT - Acceso restringido. Solo personal autorizado.#
line console 0
 logging synchronous
exit
vlan 13
 name Core_BD
exit
vlan 23
 name Web_Apps
exit
vlan 33
 name NOC
exit
spanning-tree mode rapid-pvst
interface range FastEthernet0/23 - 24
 description EtherChannel LACP hacia SW-DC-DIST
 switchport mode trunk
 channel-group 1 mode active
 no shutdown
exit
interface Port-channel1
 description EtherChannel LACP hacia SW-DC-DIST
 switchport mode trunk
exit
interface range FastEthernet0/1 - 7
 description Hosts VLAN 13 Core_BD
 switchport mode access
 switchport access vlan 13
 spanning-tree portfast
exit
end
write memory
