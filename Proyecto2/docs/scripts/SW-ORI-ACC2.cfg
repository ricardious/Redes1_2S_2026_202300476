! SW-ORI-ACC2 - BanTech GT (Proyecto 2, 202300476)
!
enable
configure terminal
hostname SW-ORI-ACC2
no ip domain-lookup
banner motd #BanTech GT - Acceso restringido. Solo personal autorizado.#
line console 0
 logging synchronous
exit
vlan 82
 name Boveda
exit
vlan 92
 name Plataforma
exit
spanning-tree mode rapid-pvst
interface GigabitEthernet0/1
 description Troncal hacia MS1
 switchport mode trunk
 no shutdown
exit
interface GigabitEthernet0/2
 description Troncal hacia MS2
 switchport mode trunk
 no shutdown
exit
interface range FastEthernet0/1 - 7
 description Hosts VLAN 92 Plataforma
 switchport mode access
 switchport access vlan 92
 spanning-tree portfast
exit
end
write memory
