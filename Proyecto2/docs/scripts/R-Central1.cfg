! R-Central1 - BanTech GT (Proyecto 2, 202300476)
!
enable
configure terminal
hostname R-Central1
no ip domain-lookup
banner motd #BanTech GT - Acceso restringido. Solo personal autorizado.#
line console 0
 logging synchronous
exit
interface GigabitEthernet0/0
 description Enlace OSPF hacia CORE-2
 ip address 10.76.0.26 255.255.255.252
 no shutdown
exit
interface GigabitEthernet0/0/0
 description Fibra optica hacia CORE-3
 ip address 10.76.0.30 255.255.255.252
 no shutdown
exit
interface GigabitEthernet0/1
 description Segmento estatico hacia R-Central2
 ip address 10.76.0.37 255.255.255.252
 no shutdown
exit
ip route 10.76.40.0 255.255.255.224 10.76.0.38
ip route 10.76.40.32 255.255.255.224 10.76.0.38
ip route 10.76.40.64 255.255.255.240 10.76.0.38
ip route 10.76.0.40 255.255.255.252 10.76.0.38
router ospf 1
router-id 4.4.4.4
 network 10.76.0.24 0.0.0.3 area 0
 network 10.76.0.28 0.0.0.3 area 0
 network 10.76.0.36 0.0.0.3 area 0
 passive-interface GigabitEthernet0/1
 redistribute static subnets
exit
end
write memory
